name: NoneCRM native runtime

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ci/nonecrm-native-checks]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nonecrm-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.repository == 'DavidDreambular/hermes-agent' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install frozen test dependencies
        run: |
          python -m pip install uv==0.11.6
          uv sync --frozen --extra dev --extra messaging --python "$(command -v python)"
      - name: Verify native provider and API contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(tests/hermes_cli/test_auth_commands.py tests/hermes_cli/test_auth_codex_provider.py tests/hermes_cli/test_runtime_provider_resolution.py tests/agent/test_codex_responses_adapter.py tests/gateway/test_api_server.py tests/gateway/test_api_server_toolset.py tests/gateway/test_auth_fallback.py tests/run_agent/test_fallback_credential_isolation.py)
          if [ -f tests/gateway/test_nonecrm_native_config.py ]; then
            files+=(tests/gateway/test_nonecrm_native_config.py)
          fi
          if [ -f tests/gateway/test_nonecrm_artifact_admission.py ]; then
            files+=(tests/gateway/test_nonecrm_artifact_admission.py)
          fi
          HOME="$(mktemp -d)" scripts/run_tests.sh -j 2 --file-retries 0 "${files[@]}"
      - name: Verify isolated root bootstrap transactions
        run: |
          sudo env -i PATH="$PATH" HOME=/root HERMES_PYTHON="$PWD/.venv/bin/python" bash scripts/run_tests.sh -j 1 --file-retries 0 tests/gateway/test_nonecrm_admission_bootstrap.py tests/gateway/test_nonecrm_bootstrap_hardening.py

  signed-admission:
    needs: [tests, artifact]
    if: always() && needs.tests.result == 'success' && github.repository == 'DavidDreambular/hermes-agent' && (github.ref != 'refs/heads/main' || needs.artifact.result == 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # Read the restricted bypass field for the live-shape integration fixture.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch genuine hosted main fixture and pinned public verifier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/signed-fixture /tmp/verifier-fixture
          gh api repos/DavidDreambular/hermes-agent/rulesets/24670342 > /tmp/signed-fixture/source-policy.json
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            run_id="$GITHUB_RUN_ID"
          else
            run_id="$(gh api 'repos/DavidDreambular/hermes-agent/actions/workflows/nonecrm-native-runtime.yml/runs?branch=main&event=push&status=success&per_page=1' --jq '.workflow_runs[0].id')"
          fi
          artifact_id="$(gh api "repos/DavidDreambular/hermes-agent/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.expired == false and (.name | startswith("nonecrm-hermes-"))) | .id')"
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          gh api "repos/DavidDreambular/hermes-agent/actions/artifacts/$artifact_id/zip" > /tmp/signed-fixture.zip
          python3 -c 'import zipfile,pathlib; z=zipfile.ZipFile("/tmp/signed-fixture.zip"); names={"image.tar.gz","image.json","attestation.json"}; assert len(z.infolist())==3 and set(z.namelist())==names; assert all(0<i.file_size<=1000000000 for i in z.infolist()); z.extractall("/tmp/signed-fixture")'
          curl -fsSL --retry 3 https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz -o /tmp/verifier-fixture/gh.tar.gz
          printf '%s  %s\n' bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386 /tmp/verifier-fixture/gh.tar.gz | sha256sum -c -
          tar -xzf /tmp/verifier-fixture/gh.tar.gz -C /tmp/verifier-fixture gh_2.102.0_linux_amd64/bin/gh
          install -m 0755 /tmp/verifier-fixture/gh_2.102.0_linux_amd64/bin/gh /tmp/verifier-fixture/gh
          env -i HOME=/tmp/verifier-fixture PATH=/usr/bin:/bin /tmp/verifier-fixture/gh attestation trusted-root > /tmp/verifier-fixture/trusted-root.jsonl
          printf '%s  %s\n' 7469124f706944133d6a169691dd1c6c3511b12e85878d255e044e2948df4c9b /tmp/verifier-fixture/gh 65ca537f6ed8a47fd0e560c421baa1f6c1efb8b25fc200d8c5c02c0e92eb2b9c /tmp/verifier-fixture/trusted-root.jsonl | sha256sum -c -
      - name: Execute real admission in isolated root container
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f ops/nonecrm/Dockerfile --build-arg SOURCE_REVISION="$GITHUB_SHA" -t nonecrm-hermes:admission-fixture .
          docker run --rm --hostname MidPointsIA --user 0 --cap-drop ALL --security-opt no-new-privileges \
            --mount type=bind,src="$PWD",dst=/source,readonly --mount type=bind,src=/tmp/signed-fixture,dst=/signed-fixture,readonly --mount type=bind,src=/tmp/verifier-fixture,dst=/verifier-fixture,readonly \
            --entrypoint /bin/bash nonecrm-hermes:admission-fixture -c 'set -euo pipefail; /usr/local/bin/python -m pip --python /opt/hermes/.venv/bin/python install pytest==8.4.2 pytest-asyncio==1.2.0 pytest-timeout==2.4.0 >/dev/null; mkdir /root/repo; cp -r /source/scripts /source/tests /source/ops /source/pyproject.toml /root/repo/; HOME=/root HERMES_PYTHON=/opt/hermes/.venv/bin/python HERMES_TEST_FILE_RETRIES=0 /root/repo/scripts/run_tests.sh -j 1 tests/gateway/test_nonecrm_artifact_admission.py'

  artifact:
    needs: tests
    if: github.repository == 'DavidDreambular/hermes-agent' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # GitHub only discloses bypass actors to repository writers.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require committed runtime recipe
        run: test -f ops/nonecrm/Dockerfile
      - name: Build and verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          docker build --platform linux/amd64 -f ops/nonecrm/Dockerfile --build-arg SOURCE_REVISION="$GITHUB_SHA" -t nonecrm-hermes:verified .
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=64m --tmpfs /opt/data:rw,nosuid,size=64m,uid=10000,gid=10000 --cap-drop ALL --security-opt no-new-privileges -e EXPECTED_SOURCE_REVISION="$GITHUB_SHA" --entrypoint /opt/hermes/.venv/bin/python nonecrm-hermes:verified -I /opt/hermes/ops/nonecrm/image_smoke.py
          mkdir release
          docker image inspect nonecrm-hermes:verified > release/image.json
          docker save nonecrm-hermes:verified | gzip -1 > release/image.tar.gz
      - name: Bind live source protection into signed metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/DavidDreambular/hermes-agent/rulesets/24670342 > /tmp/source-policy.json
          python3 -c 'import json,pathlib; p=json.load(open("/tmp/source-policy.json")); assert p.get("id")==24670342 and p.get("bypass_actors")==[] and p.get("enforcement")=="active"; f=pathlib.Path("release/image.json"); m=json.loads(f.read_text()); m[0]["NonecrmSourcePolicy"]=p; f.write_text(json.dumps(m),encoding="utf-8")'
      - name: Verify fixed recovery in isolated root container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --hostname MidPointsIA --user 0 --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --security-opt no-new-privileges \
            --mount type=bind,src="$PWD",dst=/source,readonly --entrypoint /bin/bash nonecrm-hermes:verified -c '
              set -euo pipefail
              /usr/local/bin/python -m pip --python /opt/hermes/.venv/bin/python install pytest==8.4.2 pytest-asyncio==1.2.0 pytest-timeout==2.4.0 >/dev/null
              mkdir /root/repo
              cp -r /source/scripts /source/tests /source/ops /source/pyproject.toml /root/repo/
              HOME=/root HERMES_PYTHON=/opt/hermes/.venv/bin/python HERMES_TEST_FILE_RETRIES=0 /root/repo/scripts/run_tests.sh -j 1 tests/gateway/test_nonecrm_recovery_root.py'
      - name: Attest archive and image metadata
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/image.tar.gz
            release/image.json
          push-to-registry: false
      - name: Package independent build evidence
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" release/attestation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nonecrm-hermes-${{ github.sha }}
          path: release/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
